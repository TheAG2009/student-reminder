<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <title>EduSync | Premium Student Hub</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- SPLASH SCREEN -->
    <div id="splash-screen" class="screen active-screen">
        <div class="logo-container">
            <i class="fa-solid fa-graduation-cap glow-icon"></i>
            <h1 class="neon-text">EduSync</h1>
            <p>Premium Organizer</p>
        </div>
        <div class="loading-spinner"></div>
    </div>

    <!-- AUTH SCREEN -->
    <div id="auth-screen" class="screen hidden">
        <div class="glass-panel auth-container">
            <div class="auth-tabs">
                <button class="tab-btn active" data-target="login-form">Login</button>
                <button class="tab-btn" data-target="signup-form">Register</button>
                <button class="tab-btn admin-tab" data-target="admin-login-form"><i class="fa-solid fa-shield-halved"></i></button>
            </div>

            <form id="login-form" class="auth-form active">
                <h2>Welcome Back</h2>
                <div class="input-group">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="login-email" placeholder="Email" required>
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="login-password" placeholder="Password" required>
                </div>
                <button type="submit" class="primary-btn neon-btn">Login to Dashboard</button>
            </form>

            <form id="admin-login-form" class="auth-form hidden">
                <h2>Admin Portal</h2>
                <div class="input-group">
                    <i class="fa-solid fa-user-tie"></i>
                    <input type="email" id="admin-email" placeholder="Admin Email" required>
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="admin-password" placeholder="Admin Password" required>
                </div>
                <button type="submit" class="primary-btn admin-btn">Access Panel</button>
            </form>

            <form id="signup-form" class="auth-form hidden scrollable-form">
                <h2>Create Account</h2>
                <div class="form-grid">
                    <div class="input-group"><input type="text" id="reg-fullname" placeholder="Full Name" required></div>
                    <div class="input-group row-group">
                        <select id="reg-gender" required>
                            <option value="" disabled selected>Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                        <input type="date" id="reg-dob" required>
                    </div>
                    <div class="input-group"><input type="text" id="reg-school" placeholder="School/College Name" required></div>
                    <div class="input-group row-group">
                        <input type="text" id="reg-standard" placeholder="Sem" required>
                        <input type="text" id="reg-department" placeholder="Dept" required>
                    </div>
                    <div class="input-group"><input type="email" id="reg-email" placeholder="Email" required></div>
                    <div class="input-group"><input type="tel" id="reg-phone" placeholder="Phone Number" required></div>
                </div>
                <button type="submit" class="primary-btn neon-btn">Register & Generate ID</button>
            </form>
        </div>
    </div>

    <!-- STUDENT DASHBOARD -->
    <div id="student-dashboard" class="screen hidden main-layout">
        <header class="glass-header">
            <div class="user-info">
                <div class="avatar-placeholder"><i class="fa-solid fa-user"></i></div>
                <div>
                    <h3 id="header-name">Student Name</h3>
                    <p id="header-id">ID: STU-0000</p>
                </div>
            </div>
            <div class="header-actions">
                <button id="logout-btn" class="icon-btn"><i class="fa-solid fa-power-off"></i></button>
            </div>
        </header>

        <main class="dashboard-content">
            <div class="stats-container">
                <div class="glass-card stat-card glow-blue">
                    <i class="fa-solid fa-list-check"></i>
                    <div><h4 id="stat-pending">0</h4><p>Pending</p></div>
                </div>
                <div class="glass-card stat-card glow-purple">
                    <i class="fa-solid fa-graduation-cap"></i>
                    <div><h4 id="stat-exams">0</h4><p>Exams</p></div>
                </div>
            </div>

            <div class="id-card-section">
                <div class="flip-card" id="student-id-card">
                    <div class="flip-card-inner">
                        <div class="flip-card-front glass-card premium-bg">
                            <div class="id-header"><span>STUDENT ID</span></div>
                            <div class="id-body">
                                <div class="id-photo-frame"><i class="fa-solid fa-user"></i></div>
                                <div class="id-details">
                                    <h2 id="id-name">User Name</h2>
                                    <p id="id-course">Department</p>
                                    <p id="id-uid">ID: STU-XXXX</p>
                                </div>
                            </div>
                        </div>
                        <div class="flip-card-back glass-card premium-bg">
                            <i class="fa-solid fa-qrcode" style="font-size: 80px;"></i>
                            <p>Digital Verification</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="section-header">
                <h3>My Tasks</h3>
            </div>
            <div id="tasks-container" class="task-list">
                <!-- Injected tasks -->
            </div>
        </main>

        <button id="fab-add-task" class="fab neon-btn"><i class="fa-solid fa-plus"></i></button>
    </div>

    <!-- ADD TASK MODAL -->
    <div id="add-task-modal" class="modal-overlay hidden">
        <div class="glass-card modal-content">
            <div class="modal-header">
                <h2>New Task</h2>
                <button class="close-modal"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="task-form">
                <input type="text" id="task-title" placeholder="What needs to be done?" required>
                <select id="task-type">
                    <option value="Homework">Homework</option>
                    <option value="Exam">Exam</option>
                    <option value="Assignment">Assignment</option>
                </select>
                <div class="row-group">
                    <input type="date" id="task-date" required>
                    <input type="time" id="task-time" required>
                </div>
                <button type="submit" class="primary-btn neon-btn">Add Reminder</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
